services:
  wq-publish:
    build: .
    image: wq-publish:latest
    container_name: wq-publish
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      WQ_DATA_DIR: /data
      WQ_DOWNSTREAM_DIR: /downstream
    volumes:
      - wq-data:/data
      - wq-downstream:/downstream
    restart: unless-stopped

volumes:
  wq-data:
  wq-downstream:
